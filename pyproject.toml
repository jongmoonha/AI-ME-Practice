[project]
name = "ai-me-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grad-cam>=1.5.5",
    "ipykernel>=6.30.1",
    "optuna>=4.5.0",
    "pycaret>=3.3.2",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchsummary>=1.5.1",
    "torchvision>=0.26.0",
    "xgboost>=3.0.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
